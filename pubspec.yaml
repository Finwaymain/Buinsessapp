name: cabme_driver
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.5+5

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  bottom_picker: ^4.1.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  google_sign_in: ^7.1.1
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.1
  firebase_database: ^12.0.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0  #11.3.3
  googleapis_auth: ^2.0.0
  dropdown_search: ^6.0.2
  file_picker: ^10.3.3  #10.3.2
  firebase_auth: ^6.0.2
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  firebase_storage: ^13.0.1
  flutter_easyloading: ^3.0.5
  flutter_google_places_hoc081098: ^2.0.0
  flutter_html: any
  flutter_local_notifications: ^19.4.1
  flutter_paypal: ^0.2.1
  flutter_polyline_points: ^3.0.1
  flutter_rating_bar: ^4.0.1
  flutter_stripe: ^11.4.0   #12.0.2
  flutter_svg: ^2.0.17
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.7.2
  

  image_picker: ^1.1.2
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  map_launcher: ^4.4.2

  path_provider: ^2.1.5
  photo_view: ^0.15.0
  pinput: ^5.0.1
  razorpay_flutter: ^1.4.0
  shared_preferences: ^2.5.2
  firebase_app_check: ^0.4.0+1

  text_scroll: ^0.2.0
  url_launcher: ^6.3.1
  video_compress: ^3.1.4
  video_player: ^2.9.3
  get_thumbnail_video: ^0.7.3
  google_fonts: ^6.2.1
  location: ^8.0.0
  google_maps_flutter: ^2.10.1
  flutter_osm_plugin: ^1.4.1   #1.3.6
  provider: ^6.1.2
  in_app_review: ^2.0.10
  rename_app: ^1.6.3
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  qr_code_scanner_plus: ^2.0.12
  flutter_contacts: ^1.1.9+2   #1.1.7+1
  share_plus: ^12.0.0
  qr_flutter: ^4.1.0
  clipboard: ^0.1.3
  dotted_border: ^2.1.0
  permission_handler: ^12.0.1


dependency_overrides:
  webview_flutter: ^4.7.0
  syncfusion_flutter_pdfviewer: ^28.2.9
  http: ^1.3.0
  uuid: ^4.5.1
  package_info_plus: ^8.3.0


dev_dependencies:
  change_app_package_name: ^1.5.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appIcon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/appIcon.png"
  windows:
    generate: true
    image_path: "assets/images/appIcon.png"
  macos:
    generate: true
    image_path: "assets/images/appIcon.png"

flutter_native_splash:
  color: "#ffffff"  # splash background color
  image: assets/images/appIcon.png
  image_dark: assets/images/appIcon.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/file/
    - assets/icons/
    - assets/flags/
    - assets/

  fonts:
    - family: Switzer-Black
      fonts:
        - asset: assets/fonts/Switzer-Black.otf

    - family: Switzer-Bold
      fonts:
        - asset: assets/fonts/Switzer-Bold.otf

    - family: Switzer-Extrabold
      fonts:
        - asset: assets/fonts/Switzer-Extrabold.otf

    - family: Switzer-Extralight
      fonts:
        - asset: assets/fonts/Switzer-Extralight.otf

    - family: Switzer-Italic
      fonts:
        - asset: assets/fonts/Switzer-Italic.otf

    - family: Switzer-Medium
      fonts:
        - asset: assets/fonts/Switzer-Medium.otf

    - family: Switzer-Regular
      fonts:
        - asset: assets/fonts/Switzer-Regular.otf

    - family: Switzer-Semibold
      fonts:
        - asset: assets/fonts/Switzer-Semibold.otf

    - family: Switzer-Thin
      fonts:
        - asset: assets/fonts/Switzer-Thin.otf
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
